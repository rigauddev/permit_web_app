<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
  <rect width="1440" height="1040" fill="#f6f8f7"/>
  <rect width="1440" height="72" fill="#0f6b3f"/>
  <text x="40" y="46" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Prefeitura de Valença - Central de Eventos</text>
  <text x="1180" y="44" fill="#ffffff" font-family="Arial, sans-serif" font-size="16">Cidadão</text>

  <rect x="40" y="112" width="280" height="880" rx="8" fill="#ffffff" stroke="#d7ddd9"/>
  <text x="64" y="154" fill="#1d2b24" font-family="Arial, sans-serif" font-size="20" font-weight="700">Solicitação</text>
  <circle cx="76" cy="206" r="16" fill="#0f6b3f"/>
  <text x="72" y="212" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">1</text>
  <text x="108" y="212" fill="#1d2b24" font-family="Arial, sans-serif" font-size="16" font-weight="700">Responsável</text>
  <circle cx="76" cy="266" r="16" fill="#0f6b3f"/>
  <text x="72" y="272" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">2</text>
  <text x="108" y="272" fill="#1d2b24" font-family="Arial, sans-serif" font-size="16" font-weight="700">Documentos</text>
  <circle cx="76" cy="326" r="16" fill="#0f6b3f"/>
  <text x="72" y="332" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">3</text>
  <text x="108" y="332" fill="#1d2b24" font-family="Arial, sans-serif" font-size="16" font-weight="700">Evento</text>
  <circle cx="76" cy="386" r="16" fill="#d9b44a"/>
  <text x="72" y="392" fill="#1d2b24" font-family="Arial, sans-serif" font-size="15" font-weight="700">4</text>
  <text x="108" y="392" fill="#1d2b24" font-family="Arial, sans-serif" font-size="16" font-weight="700">Perguntas</text>
  <circle cx="76" cy="446" r="16" fill="#e7ece9"/>
  <text x="72" y="452" fill="#66756d" font-family="Arial, sans-serif" font-size="15" font-weight="700">5</text>
  <text x="108" y="452" fill="#66756d" font-family="Arial, sans-serif" font-size="16">Revisão</text>

  <rect x="360" y="112" width="680" height="880" rx="8" fill="#ffffff" stroke="#d7ddd9"/>
  <text x="392" y="158" fill="#1d2b24" font-family="Arial, sans-serif" font-size="26" font-weight="700">Perguntas condicionais do evento</text>
  <text x="392" y="188" fill="#66756d" font-family="Arial, sans-serif" font-size="16">As respostas geram automaticamente exigências por secretaria.</text>

  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="392" y="226" width="616" height="58" rx="8" fill="#f7faf8" stroke="#d7ddd9"/>
    <text x="416" y="262" fill="#1d2b24">O evento terá som?</text>
    <rect x="850" y="240" width="58" height="30" rx="15" fill="#0f6b3f"/>
    <text x="870" y="261" fill="#ffffff" font-size="14">Sim</text>
    <rect x="920" y="240" width="58" height="30" rx="15" fill="#e7ece9"/>
    <text x="942" y="261" fill="#66756d" font-size="14">Não</text>

    <rect x="392" y="302" width="616" height="58" rx="8" fill="#f7faf8" stroke="#d7ddd9"/>
    <text x="416" y="338" fill="#1d2b24">Local fixo sem alvará de funcionamento?</text>
    <rect x="850" y="316" width="58" height="30" rx="15" fill="#e7ece9"/>
    <text x="872" y="337" fill="#66756d" font-size="14">Sim</text>
    <rect x="920" y="316" width="58" height="30" rx="15" fill="#0f6b3f"/>
    <text x="942" y="337" fill="#ffffff" font-size="14">Não</text>

    <rect x="392" y="378" width="616" height="58" rx="8" fill="#f7faf8" stroke="#d7ddd9"/>
    <text x="416" y="414" fill="#1d2b24">Terá palco, gerador ou estrutura montada?</text>
    <rect x="850" y="392" width="58" height="30" rx="15" fill="#0f6b3f"/>
    <text x="870" y="413" fill="#ffffff" font-size="14">Sim</text>
    <rect x="920" y="392" width="58" height="30" rx="15" fill="#e7ece9"/>
    <text x="942" y="413" fill="#66756d" font-size="14">Não</text>

    <rect x="392" y="454" width="616" height="58" rx="8" fill="#f7faf8" stroke="#d7ddd9"/>
    <text x="416" y="490" fill="#1d2b24">Vai bloquear via ou desviar trânsito?</text>
    <rect x="850" y="468" width="58" height="30" rx="15" fill="#0f6b3f"/>
    <text x="870" y="489" fill="#ffffff" font-size="14">Sim</text>
    <rect x="920" y="468" width="58" height="30" rx="15" fill="#e7ece9"/>
    <text x="942" y="489" fill="#66756d" font-size="14">Não</text>

    <rect x="392" y="530" width="616" height="58" rx="8" fill="#f7faf8" stroke="#d7ddd9"/>
    <text x="416" y="566" fill="#1d2b24">Terá alimentação ou manipulação de alimentos?</text>
    <rect x="850" y="544" width="58" height="30" rx="15" fill="#e7ece9"/>
    <text x="872" y="565" fill="#66756d" font-size="14">Sim</text>
    <rect x="920" y="544" width="58" height="30" rx="15" fill="#0f6b3f"/>
    <text x="942" y="565" fill="#ffffff" font-size="14">Não</text>

    <rect x="392" y="606" width="616" height="58" rx="8" fill="#f7faf8" stroke="#d7ddd9"/>
    <text x="416" y="642" fill="#1d2b24">Precisará de ambulância no local?</text>
    <rect x="850" y="620" width="58" height="30" rx="15" fill="#e7ece9"/>
    <text x="872" y="641" fill="#66756d" font-size="14">Sim</text>
    <rect x="920" y="620" width="58" height="30" rx="15" fill="#0f6b3f"/>
    <text x="942" y="641" fill="#ffffff" font-size="14">Não</text>
  </g>

  <rect x="392" y="720" width="160" height="44" rx="6" fill="#ffffff" stroke="#0f6b3f"/>
  <text x="444" y="748" fill="#0f6b3f" font-family="Arial, sans-serif" font-size="16" font-weight="700">Voltar</text>
  <rect x="826" y="720" width="182" height="44" rx="6" fill="#0f6b3f"/>
  <text x="878" y="748" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Avançar</text>

  <rect x="1080" y="112" width="320" height="880" rx="8" fill="#ffffff" stroke="#d7ddd9"/>
  <text x="1112" y="156" fill="#1d2b24" font-family="Arial, sans-serif" font-size="22" font-weight="700">Exigências geradas</text>
  <text x="1112" y="190" fill="#66756d" font-family="Arial, sans-serif" font-size="14">Prévia antes do envio</text>
  <g font-family="Arial, sans-serif">
    <rect x="1112" y="226" width="248" height="78" rx="8" fill="#eef7f1"/>
    <text x="1130" y="256" fill="#0f6b3f" font-size="15" font-weight="700">Meio Ambiente</text>
    <text x="1130" y="282" fill="#1d2b24" font-size="14">Termo ambiental</text>
    <rect x="1112" y="322" width="248" height="96" rx="8" fill="#fff8e2"/>
    <text x="1130" y="352" fill="#8a6a13" font-size="15" font-weight="700">Infraestrutura</text>
    <text x="1130" y="378" fill="#1d2b24" font-size="14">Vistoria + ART</text>
    <text x="1130" y="402" fill="#1d2b24" font-size="14">AVCB / planta baixa</text>
    <rect x="1112" y="436" width="248" height="96" rx="8" fill="#eef3fb"/>
    <text x="1130" y="466" fill="#2b5c9a" font-size="15" font-weight="700">DMTRAN</text>
    <text x="1130" y="492" fill="#1d2b24" font-size="14">Bloqueio de via</text>
    <text x="1130" y="516" fill="#1d2b24" font-size="14">Croqui/mapa do circuito</text>
    <rect x="1112" y="550" width="248" height="78" rx="8" fill="#f3f1fb"/>
    <text x="1130" y="580" fill="#5b4a9a" font-size="15" font-weight="700">Saúde</text>
    <text x="1130" y="606" fill="#1d2b24" font-size="14">Ambulância / alimentação</text>
  </g>
</svg>
