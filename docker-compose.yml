services:
  mysql:
    image: mysql:8.4
    platform: linux/amd64
    container_name: permit_mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-permit_system}
      MYSQL_USER: ${MYSQL_USER:-permit_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-permit_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-permit_root_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - permit_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./permit_system
      dockerfile: Dockerfile
    container_name: permit_system_api
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+mysqlconnector://permit_user:permit_password@mysql:3306/permit_system}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-dev}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SDE_EMAIL: ${SDE_EMAIL:-sde@valenca.ba.gov.br}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PREFEITURA_LOGO_URL: ${PREFEITURA_LOGO_URL:-}
      HISTORICAL_EVENTS_XLSX_PATH: ${HISTORICAL_EVENTS_XLSX_PATH:-/app/private/Planilha_de_solicitacao_de_eventos.xlsx}
      RUN_SEED: ${RUN_SEED:-true}
    volumes:
      - ./permit_system/private:/app/private:ro
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    container_name: permit_web_app
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    container_name: permit_caddy
    profiles:
      - https
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-servicevca.zapto.org}
    volumes:
      - ${CADDYFILE_PATH:-./docs/Caddyfile.docker.example}:/etc/caddy/Caddyfile:ro
      - permit_caddy_data:/data
      - permit_caddy_config:/config
    restart: unless-stopped

volumes:
  permit_mysql_data:
  permit_caddy_data:
  permit_caddy_config:
